services:
  app:
    stop_grace_period: 60s
    build:
      context: .
    environment:
      NODE_ENV: production
      MAILDOCK_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY}
      CREDENTIALS_ENCRYPTION_KEY_ID: v1
      CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS: "{}"
      ATTACHMENTS_PATH: /var/lib/maildock/attachments
      MAILDOCK_IMAP_SLICE_UID_SPAN: ${MAILDOCK_IMAP_SLICE_UID_SPAN:-500}
      MAILDOCK_IMAP_SLICE_TIMEOUT_MS: ${MAILDOCK_IMAP_SLICE_TIMEOUT_MS:-60000}
      MAILDOCK_GMAIL_USER_UNITS_PER_MINUTE: ${MAILDOCK_GMAIL_USER_UNITS_PER_MINUTE:-4000}
      MAILDOCK_GMAIL_PROJECT_UNITS_PER_MINUTE: ${MAILDOCK_GMAIL_PROJECT_UNITS_PER_MINUTE:-100000}
      MAILDOCK_GMAIL_DAILY_UNITS: ${MAILDOCK_GMAIL_DAILY_UNITS:-2000000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - attachments_data:/var/lib/maildock/attachments
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: maildock
      POSTGRES_USER: maildock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maildock -d maildock"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  attachments_data:
