services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      MAILDOCK_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      DATABASE_URL: postgresql://maildock:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/maildock
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      MAILDOCK_BOOTSTRAP_SECRET: ${MAILDOCK_BOOTSTRAP_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY}
      CREDENTIALS_ENCRYPTION_KEY_ID: ${CREDENTIALS_ENCRYPTION_KEY_ID:-v1}
      CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS:-{}}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      ATTACHMENTS_PATH: /var/lib/maildock/attachments
      MAILDOCK_MAX_ATTACHMENT_BYTES: ${MAILDOCK_MAX_ATTACHMENT_BYTES:-15728640}
      MAILDOCK_MAX_OUTGOING_ATTACHMENT_BYTES: ${MAILDOCK_MAX_OUTGOING_ATTACHMENT_BYTES:-18874368}
      MAILDOCK_MAX_OUTGOING_MIME_BYTES: ${MAILDOCK_MAX_OUTGOING_MIME_BYTES:-26214400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAILDOCK_BACKFILL_CHUNK_SIZE: ${MAILDOCK_BACKFILL_CHUNK_SIZE:-500}
      MAILDOCK_CONTENT_POLL_INTERVAL_MS: ${MAILDOCK_CONTENT_POLL_INTERVAL_MS:-400}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - attachments_data:/var/lib/maildock/attachments
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: maildock
      POSTGRES_USER: maildock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres/99-maildock-authority.sql:/docker-entrypoint-initdb.d/99-maildock-authority.sql:ro
      - ./scripts/postgres/maildock-authority-maintenance.sh:/usr/local/bin/maildock-authority-maintenance:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maildock -d maildock"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  attachments_data:
