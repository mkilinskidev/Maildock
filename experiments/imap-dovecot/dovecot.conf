dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3
base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap
imap4rev2_enable = no
mail_driver = maildir
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail
log_path = /dev/stdout
ssl = required
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}
passdb static {
  password = {PLAIN}maildock-disposable-only
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user | lower}
  }
}
namespace inbox {
  inbox = yes
  separator = /
}
mail_max_userip_connections = 10
event_exporter append_log {
  format = json
  time_format = rfc3339
}
metric append_completion {
  filter = event=imap_command_finished AND cmd_name=APPEND
  exporter = append_log
}
!include /etc/dovecot/vendor.d/rootless.conf
